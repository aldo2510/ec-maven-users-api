name: workflow dockerhub

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch: 

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:17.0.21.1_2-jdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1
